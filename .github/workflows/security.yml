name: Security

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e . pip-audit
      - run: pip install --upgrade pip setuptools wheel
      - run: pip-audit --skip-editable
