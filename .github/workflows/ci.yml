name: CI

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine

      - run: python -m build

      - run: twine check --strict dist/*

      - name: Verify templates and assets are packaged
        run: |
          unzip -l dist/*.whl | tee /tmp/wheel.txt
          grep -q "ckanext/aiextract/templates/aiextract/status.html" /tmp/wheel.txt
          grep -q "ckanext/aiextract/templates/package/read_base.html" /tmp/wheel.txt
          grep -q "ckanext/aiextract/assets/aiextract.js" /tmp/wheel.txt
          grep -q "ckanext/aiextract/assets/webassets.yml" /tmp/wheel.txt

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$VERSION" = "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ckanext-aiextract
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
