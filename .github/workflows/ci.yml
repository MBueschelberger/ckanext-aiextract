name: CI

on:
  push:
    branches: ["**"]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e . pip-audit
      - run: pip install --upgrade pip setuptools wheel
      - run: pip-audit --skip-editable

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CKAN pins psycopg2 (built from source), which needs the libpq headers
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - run: pip install --upgrade pip
      - run: pip install "ckan[requirements]==2.11.*"
      - run: pip install -e ".[dev]"

      - run: pytest -v

  build:
    if: github.event_name != 'schedule'
    needs: [lint, pip-audit, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine

      - run: python -m build

      - run: twine check --strict dist/*

      - name: Verify templates and assets are packaged
        run: |
          unzip -l dist/*.whl | tee /tmp/wheel.txt
          grep -q "ckanext/aiextract/templates/aiextract/status.html" /tmp/wheel.txt
          grep -q "ckanext/aiextract/templates/package/read_base.html" /tmp/wheel.txt
          grep -q "ckanext/aiextract/assets/aiextract.js" /tmp/wheel.txt
          grep -q "ckanext/aiextract/assets/webassets.yml" /tmp/wheel.txt

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$VERSION" = "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ckanext-aiextract
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
